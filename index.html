<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M2D Heart-Murmur PWA</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <meta name="theme-color" content="#4f46e5" />
  <style>
    .download-card{display:flex;flex-direction:column;gap:.75rem;}
    .progress{width:100%;height:12px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;}
    .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#4f46e5,#06b6d4);transition:width .2s;}
    .status{font-size:.9rem;opacity:.85;}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="glass" style="padding:1rem;display:flex;justify-content:space-between;align-items:center;">
      <h1 style="margin:0;font-size:1.2rem;">M2D Heart-Murmur</h1>
      <button id="themeToggle" class="btn">Theme</button>
    </header>
    <main style="margin-top:1rem;">
      <div class="glass card download-card">
        <p>Model is large (~87 MB). Download it first; progress is shown below.</p>
        <button id="downloadBtn" class="btn">Download model into browser</button>
        <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
        <div id="downloadStatus" class="status">Not downloaded.</div>
      </div>
      <div class="glass card" style="margin-top:1rem;">
        <p>Run inference on a heart sound file.</p>
        <input type="file" id="audioFile" accept="audio/*" />
        <button id="runBtn" class="btn">Analyze</button>
        <div id="result" class="status">No result yet.</div>
        <canvas id="waveform" width="320" height="80" style="width:100%;margin-top:.5rem;"></canvas>
        <canvas id="mel" width="320" height="80" style="width:100%;margin-top:.5rem;"></canvas>
        <canvas id="gauge" width="120" height="60" style="margin-top:.5rem;"></canvas>
        <canvas id="scatter" width="200" height="200" style="margin-top:.5rem;"></canvas>
      </div>
    </main>
  </div>
  <script type="module">
    import { initTheme, toggleTheme, initAmbient, magneticButton } from 'js/ui.js';
    import { initA11y } from 'js/a11y.js';
    import { decodeFileTo16k, audioToMel } from 'js/audio_capture.js';
    import { loadModel } from 'js/backend.js';
    import { WaveformCanvas, MelHeatmap, ConfidenceGauge, EmbeddingScatter } from 'js/viz.js';
import { projectPCA } from 'js/probe.js';
    initTheme();
    initAmbient();
    initA11y();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    // magneticButton removed; search button no longer exists

    const MODEL_URL = 'models/Eheart_sound_by_Ahsan_Mandhar.onnx';
    const btn = document.getElementById('downloadBtn');
    const bar = document.getElementById('progressBar');
    const status = document.getElementById('downloadStatus');
    const runBtn = document.getElementById('runBtn');
    const result = document.getElementById('result');
    const waveform = new WaveformCanvas(document.getElementById('waveform'));
    const melHeat = new MelHeatmap(document.getElementById('mel'));
    const gauge = new ConfidenceGauge(document.getElementById('gauge'));
    const scatter = new EmbeddingScatter(document.getElementById('scatter'));
    let pca = null;
    async function loadPCA() { if (!pca) pca = await fetch('pca.json').then(r=>r.json()); return pca; }
    let session = null;
    let probe = null;

    async function ensureSession() {
      return session;
    }

    async function loadProbe() {
      if (!probe) probe = await fetch('probe.json').then(r => r.json());
      return probe;
    }

    // download + cache + load
    async function downloadAndCache() {
      btn.disabled = true;
      status.textContent = 'Starting download...';
      try {
        session = await loadModel((p) => {
          const pct = (p * 100).toFixed(1);
          bar.style.width = pct + '%';
          status.textContent = `Downloading... ${pct}%`;
        });
        bar.style.width = '100%';
        status.textContent = 'Model ready.';
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', downloadAndCache);

    runBtn.addEventListener('click', async () => {
      const file = document.getElementById('audioFile').files[0];
      if (!file) { result.textContent = 'Select an audio file first.'; return; }
      try {
        result.textContent = 'Decoding audio...';
        const samples = await decodeFileTo16k(file);
        waveform.setData(samples);
        const mel = audioToMel(samples);
        melHeat.setData(mel);
        result.textContent = 'Loading model...';
        if (!session) {
          try { session = await loadModel(); } catch (e) { result.textContent = 'Model not cached. Download first.'; return; }
        }
        if (!session) { result.textContent = 'Model not cached. Download first.'; return; }
        await loadProbe();
        result.textContent = 'Running inference...';
        const out = await analyzeAudio(samples, session, probe);
        result.textContent = `${out.label} (p=${out.p.toFixed(3)}, logit=${out.logit.toFixed(3)})`;
        gauge.setValue(out.p);
        try { const pcaData = await loadPCA(); scatter.setTraining(pcaData.points || []); const xy = projectPCA(out.embedding, pcaData); scatter.setCurrent(xy); } catch(e){}
      } catch (e) {
        result.textContent = 'Error: ' + e.message;
      }
    });

    // try to load cached model on startup
    (async () => {
      try { session = await loadModel(); if (session) status.textContent = 'Model ready (cached).'; } catch {}
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
